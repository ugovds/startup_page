<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <base target="_blank" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Startpage</title>
    <!-- Thèmes & Styles modulaires -->
    <link rel="stylesheet" href="css/themes/kanagawa.css" />
    <link rel="stylesheet" href="css/themes/sakura.css" />
    <link rel="stylesheet" href="css/themes/cyberdeck.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body data-theme="1">
    <!-- Système Ambilight permanent en arrière-plan -->
    <div class="ambilight-container" aria-hidden="true">
      <div id="bg-wallpaper" class="bg-wallpaper"></div>
      <div class="ambient-orb orb-primary"></div>
      <div class="ambient-orb orb-secondary"></div>
      <div class="bg-scanlines"></div>
    </div>

    <div class="dashboard">
      <!-- BARRE SUPÉRIEURE -->
      <header class="topbar">
        <div class="topbar-left">
          <div class="theme-switcher" title="Basculer de thème (Pavé numérique 1, 2, 3)">
            <button type="button" class="theme-btn active" data-theme-btn="1">1</button>
            <button type="button" class="theme-btn" data-theme-btn="2">2</button>
            <button type="button" class="theme-btn" data-theme-btn="3">3</button>
          </div>
          <span class="prompt-path">~/startpage</span>
        </div>

        <div class="topbar-right">
          <!-- Bouton Pinceau pour le mode édition des raccourcis -->
          <button
            type="button"
            id="edit-mode-toggle"
            class="pill-btn edit-toggle-btn"
            title="Activer/Désactiver le mode personnalisation des raccourcis"
          >
            <i class="fa-solid fa-paintbrush"></i>
            <span class="edit-btn-text">Éditer</span>
          </button>

          <div class="weather-pill" id="weather">
            <i id="weather-icon" class="fa-solid fa-cloud-moon"></i>
            <span id="weather-temp">--°C</span>
          </div>

          <div class="datetime">
            <span id="time" class="time">00:00:00</span>
            <span id="date" class="date">Loading...</span>
          </div>
        </div>
      </header>

      <!-- GRILLE PRINCIPALE À 3 COLONNES -->
      <main class="deck-grid">
        <!-- COLONNE GAUCHE : Illustration + Mini-Calendrier -->
        <aside class="col-left">
          <div class="art-card">
            <img id="main-art" src="images/gif.gif" alt="Theme Artwork" />
            <div class="art-badge">
              <span class="pulse-dot"></span> <span id="art-badge-text">修理 // ONLINE</span>
            </div>
          </div>

          <div class="cal-card">
            <div class="card-header cal-header-only">
              <div class="cal-controls">
                <button id="cal-prev" class="cal-nav-btn" title="Mois précédent">
                  <i class="fa-solid fa-chevron-left"></i>
                </button>
                <span id="cal-title" class="cal-title">Oct 2026</span>
                <button id="cal-next" class="cal-nav-btn" title="Mois suivant">
                  <i class="fa-solid fa-chevron-right"></i>
                </button>
              </div>
              <button id="cal-today" class="cal-today-btn" title="Revenir à aujourd'hui">
                auj
              </button>
            </div>

            <div class="cal-weekdays">
              <span>Lu</span><span>Ma</span><span>Me</span><span>Je</span><span>Ve</span><span>Sa</span><span>Di</span>
            </div>
            <div id="cal-days" class="cal-days"></div>
          </div>
        </aside>

        <!-- COLONNE CENTRALE : Barre de recherche + Catégories générées dynamiquement -->
        <section class="col-center">
          <div class="search-wrapper">
            <form id="search-form" class="search-box">
              <div id="engine-badge" class="engine-badge">
                <i id="engine-icon" class="fa-brands fa-google"></i>
                <span id="engine-name">Google</span>
              </div>
              <span class="prompt-arrow">&gt;</span>
              <input
                id="search-input"
                type="text"
                placeholder="Rechercher, calculer (12*8) ou taper !help pour les préfixes..."
                autocomplete="off"
                autofocus
              />
              <span id="calc-preview" class="calc-preview" hidden></span>
              <kbd class="shortcut-hint" title="Appuyez sur / pour cibler">/</kbd>
            </form>

            <ul id="suggestions-box" class="suggestions-dropdown" hidden></ul>
          </div>

          <!-- Conteneur des 4 catégories (rendu dynamique pour modification) -->
          <div id="categories-container" class="categories-grid"></div>
        </section>

        <!-- COLONNE DROITE : Actus + Tasks -->
        <aside class="col-right">
          <div class="feed-card">
            <div class="card-header feed-header-only">
              <div class="tab-group">
                <button class="tab-btn active" data-feed="f1">F1</button>
                <button class="tab-btn" data-feed="foot">Foot</button>
                <button class="tab-btn" data-feed="tech">Tech</button>
              </div>
            </div>
            <ul id="feed-list" class="feed-list">
              <li class="feed-skeleton">Connexion au flux en direct...</li>
            </ul>
          </div>

          <div class="workspace-card">
            <div class="card-header">
              <span class="tasks-title">
                <i class="fa-solid fa-list-check"></i> tasks
              </span>
              <button id="clear-date-filter" class="filter-chip" hidden title="Afficher toutes les dates">
                <span id="filter-date-label"></span> &times;
              </button>
            </div>

            <div class="ws-panel active">
              <form id="todo-form" class="todo-input-row">
                <input
                  id="todo-input"
                  type="text"
                  placeholder="+ Nouvelle tâche..."
                  autocomplete="off"
                />
                <input
                  id="todo-date"
                  type="date"
                  title="Assigner une date d'échéance (optionnel)"
                />
                <button type="submit" class="todo-add-btn" title="Ajouter">+</button>
              </form>
              <ul id="todo-list" class="todo-list"></ul>
            </div>
          </div>
        </aside>
      </main>
    </div>

    <!-- MODALE DE PERSONNALISATION DU RACCOURCI -->
    <div id="edit-modal" class="modal-backdrop" hidden>
      <div class="modal-box">
        <div class="modal-header">
          <div class="modal-title-group">
            <i class="fa-solid fa-pen-to-square"></i>
            <h3>Modifier le raccourci</h3>
          </div>
          <button type="button" id="modal-close-btn" class="modal-close">&times;</button>
        </div>

        <form id="edit-shortcut-form" class="modal-form">
          <div class="form-row">
            <label for="edit-name">Nom affiché</label>
            <input type="text" id="edit-name" required autocomplete="off" />
          </div>

          <div class="form-row">
            <label for="edit-url">Adresse URL</label>
            <input type="url" id="edit-url" required placeholder="https://..." autocomplete="off" />
          </div>

          <div class="form-row">
            <label for="edit-icon">
              <span>Classe d'icône (Font Awesome)</span>
              <a href="https://fontawesome.com/search?o=r&m=free" target="_blank" class="fa-link-hint">
                catalogue <i class="fa-solid fa-arrow-up-right-from-square"></i>
              </a>
            </label>
            <div class="icon-input-wrapper">
              <div class="icon-preview-box">
                <i id="edit-icon-preview" class="fa-solid fa-link"></i>
              </div>
              <input
                type="text"
                id="edit-icon"
                placeholder="ex: fa-brands fa-youtube"
                required
                autocomplete="off"
              />
            </div>
          </div>

          <!-- Suggestions rapides d'icônes -->
          <div class="quick-icons-group">
            <span class="quick-icons-label">Raccourcis rapides :</span>
            <div class="quick-icons-list">
              <button type="button" class="q-icon-btn" data-icon="fa-brands fa-youtube" title="YouTube"><i class="fa-brands fa-youtube"></i></button>
              <button type="button" class="q-icon-btn" data-icon="fa-brands fa-twitch" title="Twitch"><i class="fa-brands fa-twitch"></i></button>
              <button type="button" class="q-icon-btn" data-icon="fa-brands fa-discord" title="Discord"><i class="fa-brands fa-discord"></i></button>
              <button type="button" class="q-icon-btn" data-icon="fa-brands fa-github" title="GitHub"><i class="fa-brands fa-github"></i></button>
              <button type="button" class="q-icon-btn" data-icon="fa-solid fa-gamepad" title="Jeux"><i class="fa-solid fa-gamepad"></i></button>
              <button type="button" class="q-icon-btn" data-icon="fa-solid fa-code" title="Code"><i class="fa-solid fa-code"></i></button>
              <button type="button" class="q-icon-btn" data-icon="fa-solid fa-music" title="Musique"><i class="fa-solid fa-music"></i></button>
              <button type="button" class="q-icon-btn" data-icon="fa-solid fa-film" title="Vidéo/Film"><i class="fa-solid fa-film"></i></button>
              <button type="button" class="q-icon-btn" data-icon="fa-solid fa-book" title="Lecture/Livre"><i class="fa-solid fa-book"></i></button>
              <button type="button" class="q-icon-btn" data-icon="fa-solid fa-brain" title="IA"><i class="fa-solid fa-brain"></i></button>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" id="reset-all-shortcuts-btn" class="modal-btn danger">
              Réinitialiser tout par défaut
            </button>
            <div class="modal-actions-right">
              <button type="button" id="modal-cancel-btn" class="modal-btn secondary">Annuler</button>
              <button type="submit" class="modal-btn primary">Enregistrer</button>
            </div>
          </div>
        </form>
      </div>
    </div>

        <!-- Scripts modulaires -->
    <script src="js/themes.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/bookmarks.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/search.js"></script>
    <script src="js/feeds.js"></script>
    <script src="js/shortcuts.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
