<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <base target="_blank" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Startpage</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body data-theme="1">
    <!-- Système Ambilight permanent en arrière-plan -->
    <div class="ambilight-container" aria-hidden="true">
      <div id="bg-wallpaper" class="bg-wallpaper"></div>
      <div class="ambient-orb orb-primary"></div>
      <div class="ambient-orb orb-secondary"></div>
      <div class="bg-scanlines"></div>
    </div>

    <div class="dashboard">
      <!-- BARRE SUPÉRIEURE -->
      <header class="topbar">
        <div class="topbar-left">
          <div class="theme-switcher" title="Basculer de thème (Pavé numérique 1, 2, 3)">
            <button type="button" class="theme-btn active" data-theme-btn="1">1</button>
            <button type="button" class="theme-btn" data-theme-btn="2">2</button>
            <button type="button" class="theme-btn" data-theme-btn="3">3</button>
          </div>
          <span class="prompt-path">~/startpage</span>
        </div>

        <div class="topbar-right">
          <!-- Bouton Pinceau pour le mode édition des raccourcis -->
          <button
            type="button"
            id="edit-mode-toggle"
            class="pill-btn edit-toggle-btn"
            title="Activer/Désactiver le mode personnalisation des raccourcis"
          >
            <i class="fa-solid fa-paintbrush"></i>
            <span class="edit-btn-text">Éditer</span>
          </button>

          <div class="weather-pill" id="weather">
            <i id="weather-icon" class="fa-solid fa-cloud-moon"></i>
            <span id="weather-temp">--°C</span>
          </div>

          <div class="datetime">
            <span id="time" class="time">00:00:00</span>
            <span id="date" class="date">Loading...</span>
          </div>
        </div>
      </header>

      <!-- GRILLE PRINCIPALE À 3 COLONNES -->
      <main class="deck-grid">
        <!-- COLONNE GAUCHE : Illustration + Mini-Calendrier -->
        <aside class="col-left">
          <div class="art-card">
            <img id="main-art" src="images/gif.gif" alt="Theme Artwork" />
            <div class="art-badge">
              <span class="pulse-dot"></span> <span id="art-badge-text">修理 // ONLINE</span>
            </div>
          </div>

          <div class="cal-card">
            <div class="card-header cal-header-only">
              <div class="cal-controls">
                <button id="cal-prev" class="cal-nav-btn" title="Mois précédent">
                  <i class="fa-solid fa-chevron-left"></i>
                </button>
                <span id="cal-title" class="cal-title">Oct 2026</span>
                <button id="cal-next" class="cal-nav-btn" title="Mois suivant">
                  <i class="fa-solid fa-chevron-right"></i>
                </button>
              </div>
              <button id="cal-today" class="cal-today-btn" title="Revenir à aujourd'hui">
                auj
              </button>
            </div>

            <div class="cal-weekdays">
              <span>Lu</span><span>Ma</span><span>Me</span><span>Je</span><span>Ve</span><span>Sa</span><span>Di</span>
            </div>
            <div id="cal-days" class="cal-days"></div>
          </div>
        </aside>

        <!-- COLONNE CENTRALE : Barre de recherche + Catégories générées dynamiquement -->
        <section class="col-center">
          <div class="search-wrapper">
            <form id="search-form" class="search-box">
              <div id="engine-badge" class="engine-badge">
                <i id="engine-icon" class="fa-brands fa-google"></i>
                <span id="engine-name">Google</span>
              </div>
              <span class="prompt-arrow">&gt;</span>
              <input
                id="search-input"
                type="text"
                placeholder="Rechercher, calculer (12*8) ou taper !help pour les préfixes..."
                autocomplete="off"
                autofocus
              />
              <span id="calc-preview" class="calc-preview" hidden></span>
              <kbd class="shortcut-hint" title="Appuyez sur / pour cibler">/</kbd>
            </form>

            <ul id="suggestions-box" class="suggestions-dropdown" hidden></ul>
          </div>

          <!-- Conteneur des 4 catégories (rendu dynamique pour modification) -->
          <div id="categories-container" class="categories-grid"></div>
        </section>

        <!-- COLONNE DROITE : Actus + Tasks -->
        <aside class="col-right">
          <div class="feed-card">
            <div class="card-header feed-header-only">
              <div class="tab-group">
                <button class="tab-btn active" data-feed="f1">F1</button>
                <button class="tab-btn" data-feed="foot">Foot</button>
                <button class="tab-btn" data-feed="tech">Tech</button>
              </div>
            </div>
            <ul id="feed-list" class="feed-list">
              <li class="feed-skeleton">Connexion au flux en direct...</li>
            </ul>
          </div>

          <div class="workspace-card">
            <div class="card-header">
              <span class="tasks-title">
                <i class="fa-solid fa-list-check"></i> tasks
              </span>
              <button id="clear-date-filter" class="filter-chip" hidden title="Afficher toutes les dates">
                <span id="filter-date-label"></span> &times;
              </button>
            </div>

            <div class="ws-panel active">
              <form id="todo-form" class="todo-input-row">
                <input
                  id="todo-input"
                  type="text"
                  placeholder="+ Nouvelle tâche..."
                  autocomplete="off"
                />
                <input
                  id="todo-date"
                  type="date"
                  title="Assigner une date d'échéance (optionnel)"
                />
                <button type="submit" class="todo-add-btn" title="Ajouter">+</button>
              </form>
              <ul id="todo-list" class="todo-list"></ul>
            </div>
          </div>
        </aside>
      </main>
    </div>

    <!-- MODALE DE PERSONNALISATION DU RACCOURCI -->
    <div id="edit-modal" class="modal-backdrop" hidden>
      <div class="modal-box">
        <div class="modal-header">
          <div class="modal-title-group">
            <i class="fa-solid fa-pen-to-square"></i>
            <h3>Modifier le raccourci</h3>
          </div>
          <button type="button" id="modal-close-btn" class="modal-close">&times;</button>
        </div>

        <form id="edit-shortcut-form" class="modal-form">
          <div class="form-row">
            <label for="edit-name">Nom affiché</label>
            <input type="text" id="edit-name" required autocomplete="off" />
          </div>

          <div class="form-row">
            <label for="edit-url">Adresse URL</label>
            <input type="url" id="edit-url" required placeholder="https://..." autocomplete="off" />
          </div>

          <div class="form-row">
            <label for="edit-icon">
              <span>Classe d'icône (Font Awesome)</span>
              <a href="https://fontawesome.com/search?o=r&m=free" target="_blank" class="fa-link-hint">
                catalogue <i class="fa-solid fa-arrow-up-right-from-square"></i>
              </a>
            </label>
            <div class="icon-input-wrapper">
              <div class="icon-preview-box">
                <i id="edit-icon-preview" class="fa-solid fa-link"></i>
              </div>
              <input
                type="text"
                id="edit-icon"
                placeholder="ex: fa-brands fa-youtube"
                required
                autocomplete="off"
              />
            </div>
          </div>

          <!-- Suggestions rapides d'icônes -->
          <div class="quick-icons-group">
            <span class="quick-icons-label">Raccourcis rapides :</span>
            <div class="quick-icons-list">
              <button type="button" class="q-icon-btn" data-icon="fa-brands fa-youtube" title="YouTube"><i class="fa-brands fa-youtube"></i></button>
              <button type="button" class="q-icon-btn" data-icon="fa-brands fa-twitch" title="Twitch"><i class="fa-brands fa-twitch"></i></button>
              <button type="button" class="q-icon-btn" data-icon="fa-brands fa-discord" title="Discord"><i class="fa-brands fa-discord"></i></button>
              <button type="button" class="q-icon-btn" data-icon="fa-brands fa-github" title="GitHub"><i class="fa-brands fa-github"></i></button>
              <button type="button" class="q-icon-btn" data-icon="fa-solid fa-gamepad" title="Jeux"><i class="fa-solid fa-gamepad"></i></button>
              <button type="button" class="q-icon-btn" data-icon="fa-solid fa-code" title="Code"><i class="fa-solid fa-code"></i></button>
              <button type="button" class="q-icon-btn" data-icon="fa-solid fa-music" title="Musique"><i class="fa-solid fa-music"></i></button>
              <button type="button" class="q-icon-btn" data-icon="fa-solid fa-film" title="Vidéo/Film"><i class="fa-solid fa-film"></i></button>
              <button type="button" class="q-icon-btn" data-icon="fa-solid fa-book" title="Lecture/Livre"><i class="fa-solid fa-book"></i></button>
              <button type="button" class="q-icon-btn" data-icon="fa-solid fa-brain" title="IA"><i class="fa-solid fa-brain"></i></button>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" id="reset-all-shortcuts-btn" class="modal-btn danger">
              Réinitialiser tout par défaut
            </button>
            <div class="modal-actions-right">
              <button type="button" id="modal-cancel-btn" class="modal-btn secondary">Annuler</button>
              <button type="submit" class="modal-btn primary">Enregistrer</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <script>
      // 1. GESTION DES 3 THÈMES (Touches 1, 2, 3 du pavé numérique ou clic)
      const themesConfig = {
        '1': {
          img: 'images/gif.gif',
          badge: '修理 // KANAGAWA',
          accent: '#a8e6f0'
        },
        '2': {
          img: 'images/gif2.gif',
          badge: '桜 // SAKURA',
          accent: '#ff85c0'
        },
        '3': {
          img: 'images/gif3.gif',
          badge: '電脳 // CYBERDECK',
          accent: '#31e1f7'
        }
      };

      const bgWallpaperEl = document.getElementById('bg-wallpaper');
      const mainArtImg = document.getElementById('main-art');
      const artBadgeText = document.getElementById('art-badge-text');
      const themeBtns = document.querySelectorAll('.theme-btn');

      let currentTheme = localStorage.getItem('startpage_theme') || '1';
      if (!themesConfig[currentTheme]) currentTheme = '1';

      function applyTheme(themeId) {
        const cfg = themesConfig[themeId];
        if (!cfg) return;
        currentTheme = themeId;
        document.body.setAttribute('data-theme', themeId);
        mainArtImg.src = cfg.img;
        bgWallpaperEl.style.backgroundImage = `url("${cfg.img}")`;
        artBadgeText.textContent = cfg.badge;

        themeBtns.forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.themeBtn === themeId);
        });

        localStorage.setItem('startpage_theme', themeId);
      }

      themeBtns.forEach((btn) => {
        btn.addEventListener('click', () => applyTheme(btn.dataset.themeBtn));
      });

      applyTheme(currentTheme);

      // 2. RACCOURCIS PAR DÉFAUT & SYSTÈME DE GESTION LOCALSTORAGE
      const defaultCategories = [
        {
          id: 'social',
          title: 'Social',
          icon: 'fa-solid fa-share-nodes',
          links: [
            { name: 'YouTube', url: 'https://www.youtube.com/', icon: 'fa-brands fa-youtube' },
            { name: 'Twitch', url: 'https://www.twitch.tv/', icon: 'fa-brands fa-twitch' },
            { name: 'Gmail', url: 'https://mail.google.com/', icon: 'fa-solid fa-envelope-open-text' },
            { name: 'Twitter / X', url: 'https://x.com/', icon: 'fa-brands fa-x-twitter' },
            { name: 'Google Docs', url: 'https://docs.google.com/document/', icon: 'fa-solid fa-file-lines' },
            { name: 'Google Slides', url: 'https://docs.google.com/presentation/', icon: 'fa-solid fa-display' }
          ]
        },
        {
          id: 'jeux',
          title: 'Jeux',
          icon: 'fa-solid fa-gamepad',
          links: [
            { name: 'Chess', url: 'https://www.chess.com/home', icon: 'fa-solid fa-chess-knight' },
            { name: 'Monkeytype', url: 'https://monkeytype.com/', icon: 'fa-solid fa-keyboard' },
            { name: 'Cémantix', url: 'https://cemantix.certitudes.org/', icon: 'fa-solid fa-fire-flame-curved' },
            { name: 'Worldle', url: 'https://worldle.teuteuf.fr/', icon: 'fa-solid fa-earth-europe' },
            { name: 'Framed', url: 'https://framed.wtf/', icon: 'fa-solid fa-film' },
            { name: 'Chronophoto', url: 'https://www.chronophoto.app/', icon: 'fa-solid fa-camera-retro' }
          ]
        },
        {
          id: 'ia',
          title: 'IA',
          icon: 'fa-solid fa-microchip',
          links: [
            { name: 'Gemini', url: 'https://gemini.google.com/app?hl=fr', icon: 'fa-solid fa-wand-magic-sparkles' },
            { name: 'ChatGPT', url: 'https://chatgpt.com/', icon: 'fa-solid fa-bolt' },
            { name: 'NotebookLM', url: 'https://notebooklm.google.com/', icon: 'fa-solid fa-book-open-reader' },
            { name: 'Claude', url: 'https://claude.ai/new', icon: 'fa-solid fa-brain' },
            { name: 'Perplexity', url: 'https://www.perplexity.ai/', icon: 'fa-solid fa-magnifying-glass-chart' },
            { name: 'DeepSeek', url: 'https://chat.deepseek.com/', icon: 'fa-solid fa-terminal' }
          ]
        },
        {
          id: 'unif',
          title: 'Unif',
          icon: 'fa-solid fa-graduation-cap',
          links: [
            { name: 'Moodle', url: 'https://moodle.uclouvain.be/my/', icon: 'fa-solid fa-book-bookmark' },
            { name: 'INGInious', url: 'https://inginious.info.ucl.ac.be/mycourses', icon: 'fa-solid fa-code' },
            { name: 'MonHoraire', url: 'https://monhoraire.uclouvain.be/', icon: 'fa-regular fa-calendar-days' },
            { name: 'Outlook', url: 'https://outlook.office.com/mail/', icon: 'fa-solid fa-envelope' },
            { name: 'Overleaf', url: 'https://overleaf.info.ucl.ac.be/project', icon: 'fa-solid fa-feather-pointed' },
            { name: 'MyUCL', url: 'https://uclouvain.be/fr/myuclouvain', icon: 'fa-solid fa-building-columns' }
          ]
        }
      ];

      let categories = [];
      try {
        const saved = localStorage.getItem('startpage_categories_v1');
        categories = saved ? JSON.parse(saved) : structuredClone(defaultCategories);
      } catch {
        categories = structuredClone(defaultCategories);
      }

      const categoriesContainer = document.getElementById('categories-container');
      let quickShortcuts = [];

      function renderCategories() {
        categoriesContainer.innerHTML = categories
          .map(
            (cat, catIdx) => `
          <div class="category-card" data-cat="${catIdx}">
            <div class="category-header">
              <i class="${cat.icon}"></i>
              <h3>${cat.title}</h3>
            </div>
            <div class="link-list">
              ${cat.links
                .map(
                  (link, linkIdx) => `
                <a href="${link.url}" class="link-item" data-cat="${catIdx}" data-link="${linkIdx}">
                  <i class="${link.icon}"></i>
                  <span>${link.name}</span>
                  <span class="link-edit-badge" title="Modifier ce raccourci">
                    <i class="fa-solid fa-pen"></i>
                  </span>
                </a>
              `
                )
                .join('')}
            </div>
          </div>
        `
          )
          .join('');

        // Mise à jour de la liste des raccourcis pour la barre de recherche
        quickShortcuts = [];
        categories.forEach((cat) => {
          cat.links.forEach((l) => {
            quickShortcuts.push({
              title: l.name,
              url: l.url,
              icon: l.icon
            });
          });
        });
      }

      renderCategories();

      // 3. GESTION DU MODE ÉDITION (PINCEAU) & DE LA MODALE
      let isEditMode = false;
      const editToggleBtn = document.getElementById('edit-mode-toggle');
      const editModal = document.getElementById('edit-modal');
      const modalCloseBtn = document.getElementById('modal-close-btn');
      const modalCancelBtn = document.getElementById('modal-cancel-btn');
      const editForm = document.getElementById('edit-shortcut-form');
      const editNameInput = document.getElementById('edit-name');
      const editUrlInput = document.getElementById('edit-url');
      const editIconInput = document.getElementById('edit-icon');
      const editIconPreview = document.getElementById('edit-icon-preview');
      const resetAllBtn = document.getElementById('reset-all-shortcuts-btn');

      let currentEditingTarget = { catIdx: null, linkIdx: null };

      editToggleBtn.addEventListener('click', () => {
        isEditMode = !isEditMode;
        document.body.classList.toggle('edit-mode-active', isEditMode);
        editToggleBtn.classList.toggle('active', isEditMode);
      });

      // Clic sur un lien : en mode édition, on ouvre la modale au lieu de naviguer
      categoriesContainer.addEventListener('click', (e) => {
        const linkEl = e.target.closest('.link-item');
        if (!linkEl) return;

        if (isEditMode) {
          e.preventDefault();
          const catIdx = Number(linkEl.dataset.cat);
          const linkIdx = Number(linkEl.dataset.link);
          openEditModal(catIdx, linkIdx);
        }
      });

      function openEditModal(catIdx, linkIdx) {
        currentEditingTarget = { catIdx, linkIdx };
        const data = categories[catIdx].links[linkIdx];
        editNameInput.value = data.name;
        editUrlInput.value = data.url;
        editIconInput.value = data.icon;
        updateIconPreview(data.icon);
        editModal.hidden = false;
        editNameInput.focus();
      }

      function closeEditModal() {
        editModal.hidden = true;
        currentEditingTarget = { catIdx: null, linkIdx: null };
      }

      modalCloseBtn.addEventListener('click', closeEditModal);
      modalCancelBtn.addEventListener('click', closeEditModal);

      editModal.addEventListener('click', (e) => {
        if (e.target === editModal) closeEditModal();
      });

      // Aperçu en temps réel de l'icône dans la modale
      function updateIconPreview(cls) {
        editIconPreview.className = cls || 'fa-solid fa-link';
      }

      editIconInput.addEventListener('input', () => {
        updateIconPreview(editIconInput.value.trim());
      });

      // Clic sur l'une des icônes rapides
      document.querySelectorAll('.q-icon-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const iconCls = btn.dataset.icon;
          editIconInput.value = iconCls;
          updateIconPreview(iconCls);
        });
      });

      // Sauvegarde du raccourci
      editForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const { catIdx, linkIdx } = currentEditingTarget;
        if (catIdx === null || linkIdx === null) return;

        categories[catIdx].links[linkIdx] = {
          name: editNameInput.value.trim(),
          url: editUrlInput.value.trim(),
          icon: editIconInput.value.trim()
        };

        localStorage.setItem('startpage_categories_v1', JSON.stringify(categories));
        renderCategories();
        closeEditModal();
      });

      // Réinitialiser tout par défaut
      resetAllBtn.addEventListener('click', () => {
        if (confirm('Voulez-vous vraiment restaurer tous les raccourcis d\'origine ?')) {
          categories = structuredClone(defaultCategories);
          localStorage.setItem('startpage_categories_v1', JSON.stringify(categories));
          renderCategories();
          closeEditModal();
        }
      });

      // 4. HORLOGE & DATE EN TEMPS RÉEL
      function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('time').textContent = `${h}:${m}:${s}`;

        const options = { weekday: 'short', month: 'short', day: 'numeric' };
        document.getElementById('date').textContent = now.toLocaleDateString('fr-FR', options);
      }
      setInterval(updateClock, 1000);
      updateClock();

      // 5. MÉTÉO VIA WTTR.IN
      async function fetchWeather() {
        try {
          const res = await fetch('https://wttr.in/?format=j1');
          if (!res.ok) throw new Error();
          const data = await res.json();
          const current = data.current_condition[0];
          const temp = current.temp_C;
          const desc = current.weatherDesc[0].value.toLowerCase();
          document.getElementById('weather-temp').textContent = `${temp}°C ~ ${desc}`;

          const iconEl = document.getElementById('weather-icon');
          if (desc.includes('rain') || desc.includes('drizzle')) {
            iconEl.className = 'fa-solid fa-cloud-rain';
          } else if (desc.includes('clear') || desc.includes('sun')) {
            iconEl.className = 'fa-solid fa-sun';
          } else if (desc.includes('snow')) {
            iconEl.className = 'fa-solid fa-snowflake';
          } else {
            iconEl.className = 'fa-solid fa-cloud';
          }
        } catch {
          document.getElementById('weather-temp').textContent = 'offline';
        }
      }
      fetchWeather();
      setInterval(fetchWeather, 1800000);

      // 6. MOTEUR DE RECHERCHE, CALCULATRICE, AUTOCOMPLÉTION & !HELP
      const searchForm = document.getElementById('search-form');
      const searchInput = document.getElementById('search-input');
      const engineBadge = document.getElementById('engine-badge');
      const engineIcon = document.getElementById('engine-icon');
      const engineName = document.getElementById('engine-name');
      const calcPreview = document.getElementById('calc-preview');
      const suggestionsBox = document.getElementById('suggestions-box');

      const engines = {
        '!yt': { name: 'YouTube', icon: 'fa-brands fa-youtube', desc: 'Rechercher sur YouTube', url: 'https://www.youtube.com/results?search_query=' },
        '!tr': { name: 'DeepL', icon: 'fa-solid fa-language', desc: 'Traduire via DeepL', url: 'https://www.deepl.com/translator#auto/fr/' },
        '!maps': { name: 'Maps', icon: 'fa-solid fa-location-dot', desc: 'Google Maps', url: 'https://www.google.com/maps/search/' },
        '!img': { name: 'Images', icon: 'fa-regular fa-images', desc: 'Google Images', url: 'https://www.google.com/search?tbm=isch&q=' },
        '!w': { name: 'Wikipédia', icon: 'fa-brands fa-wikipedia-w', desc: 'Wikipédia', url: 'https://fr.wikipedia.org/wiki/Special:Search?search=' },
        '!d': { name: 'DuckDuckGo', icon: 'fa-solid fa-shield-halved', desc: 'DuckDuckGo', url: 'https://duckduckgo.com/?q=' },
        '!gh': { name: 'GitHub', icon: 'fa-brands fa-github', desc: 'GitHub', url: 'https://github.com/search?q=' },
        '!so': { name: 'StackOverflow', icon: 'fa-brands fa-stack-overflow', desc: 'StackOverflow', url: 'https://stackoverflow.com/search?q=' },
        '!arch': { name: 'ArchWiki', icon: 'fa-brands fa-linux', desc: 'ArchWiki', url: 'https://wiki.archlinux.org/index.php?search=' },
        '!r': { name: 'Reddit', icon: 'fa-brands fa-reddit-alien', desc: 'Reddit', url: 'https://www.reddit.com/search/?q=' }
      };

      let currentSuggestions = [];
      let selectedSuggestionIndex = -1;
      let activePrefix = null;

      function tryEvaluateMath(expr) {
        const clean = expr.replace(/\s+/g, '');
        if (!/^[0-9+\-*/().%^]+$/.test(clean) || !/[+\-*/%^]/.test(clean)) return null;
        try {
          const normalized = clean.replace(/\^/g, '**');
          const result = Function(`"use strict"; return (${normalized})`)();
          if (typeof result === 'number' && isFinite(result)) {
            return Number.isInteger(result) ? result : Number(result.toFixed(4));
          }
        } catch {
          return null;
        }
        return null;
      }

      function fetchGoogleSuggestions(query) {
        return new Promise((resolve) => {
          const cbName = 'google_ac_' + Math.random().toString(36).substring(2, 9);
          const script = document.createElement('script');
          const timer = setTimeout(() => {
            cleanup();
            resolve([]);
          }, 1500);

          function cleanup() {
            clearTimeout(timer);
            delete window[cbName];
            if (script.parentNode) script.parentNode.removeChild(script);
          }

          window[cbName] = (data) => {
            cleanup();
            resolve(Array.isArray(data[1]) ? data[1] : []);
          };

          script.src = `https://suggestqueries.google.com/complete/search?client=firefox&hl=fr&q=${encodeURIComponent(query)}&callback=${cbName}`;
          script.onerror = () => {
            cleanup();
            resolve([]);
          };
          document.body.appendChild(script);
        });
      }

      function renderHelpMenu() {
        const helpItems = Object.entries(engines).map(([prefix, info]) => ({
          type: 'help',
          prefix,
          text: `${prefix}  —  ${info.desc}`,
          icon: info.icon
        }));

        currentSuggestions = helpItems;
        selectedSuggestionIndex = -1;

        suggestionsBox.innerHTML =
          `<li class="help-header">
            <span>COMMANDES & PRÉFIXES DISPONIBLES</span>
            <span>[1-2-3] Thèmes | [/] Focus</span>
          </li>` +
          helpItems
            .map(
              (item, index) => `
              <li class="suggestion-item" data-index="${index}">
                <div class="sug-left">
                  <i class="${item.icon}"></i>
                  <span class="sug-text"><strong>${item.prefix}</strong> <span class="sug-match">${engines[item.prefix].desc}</span></span>
                </div>
                <span class="sug-badge shortcut">${engines[item.prefix].name}</span>
              </li>`
            )
            .join('');

        suggestionsBox.hidden = false;
      }

      function renderSuggestions(items, rawQuery) {
        currentSuggestions = items;
        selectedSuggestionIndex = -1;

        if (!items.length) {
          suggestionsBox.hidden = true;
          suggestionsBox.innerHTML = '';
          return;
        }

        const cleanQuery = rawQuery.replace(/^![a-z]+\s*/i, '').toLowerCase();

        suggestionsBox.innerHTML = items
          .map((item, index) => {
            const textLower = item.text.toLowerCase();
            let displayHtml = item.text;
            if (cleanQuery && textLower.startsWith(cleanQuery)) {
              const matched = item.text.slice(0, cleanQuery.length);
              const rest = item.text.slice(cleanQuery.length);
              displayHtml = `<span class="sug-match">${matched}</span><strong>${rest}</strong>`;
            }

            const badgeHtml =
              item.type === 'shortcut'
                ? `<span class="sug-badge shortcut">OPEN ↵</span>`
                : `<span class="sug-badge">SEARCH</span>`;

            return `
              <li class="suggestion-item" data-index="${index}">
                <div class="sug-left">
                  <i class="${item.icon}"></i>
                  <span class="sug-text">${displayHtml}</span>
                </div>
                ${badgeHtml}
              </li>
            `;
          })
          .join('');

        suggestionsBox.hidden = false;
      }

      function highlightSuggestion() {
        const nodes = suggestionsBox.querySelectorAll('.suggestion-item');
        nodes.forEach((n, i) => {
          n.classList.toggle('active', i === selectedSuggestionIndex);
        });
      }

      function executeSuggestion(item) {
        if (item.type === 'help') {
          searchInput.value = item.prefix + ' ';
          searchInput.focus();
          searchInput.dispatchEvent(new Event('input'));
          return;
        }
        if (item.type === 'shortcut') {
          window.open(item.url, '_blank');
        } else {
          const url =
            activePrefix && engines[activePrefix]
              ? engines[activePrefix].url + encodeURIComponent(item.text)
              : 'https://www.google.com/search?q=' + encodeURIComponent(item.text);
          window.open(url, '_blank');
        }
      }

      let debounceTimer = null;
      searchInput.addEventListener('input', () => {
        const val = searchInput.value.trim();
        const parts = val.split(' ');
        const prefix = parts[0].toLowerCase();

        if (prefix === '!help') {
          engineName.textContent = 'Help';
          engineIcon.className = 'fa-solid fa-circle-question';
          calcPreview.hidden = true;
          renderHelpMenu();
          return;
        }

        if (engines[prefix]) {
          activePrefix = prefix;
          const eng = engines[prefix];
          engineName.textContent = eng.name;
          engineIcon.className = eng.icon;
          calcPreview.hidden = true;
        } else {
          activePrefix = null;
          engineName.textContent = 'Google';
          engineIcon.className = 'fa-brands fa-google';

          const mathRes = tryEvaluateMath(val);
          if (mathRes !== null) {
            calcPreview.textContent = `= ${mathRes} (Entrée pour copier)`;
            calcPreview.hidden = false;
            calcPreview.dataset.result = mathRes;
            suggestionsBox.hidden = true;
            return;
          } else {
            calcPreview.hidden = true;
          }
        }

        if (!val) {
          suggestionsBox.hidden = true;
          return;
        }

        if (val.startsWith('!') && parts.length === 1 && !engines[prefix]) {
          const matchingBangs = Object.entries(engines)
            .filter(([k]) => k.startsWith(prefix))
            .map(([k, info]) => ({
              type: 'help',
              prefix: k,
              text: `${k} — ${info.desc}`,
              icon: info.icon
            }));
          if ('!help'.startsWith(prefix)) {
            matchingBangs.unshift({
              type: 'help',
              prefix: '!help',
              text: '!help — Afficher tous les préfixes de recherche',
              icon: 'fa-solid fa-circle-question'
            });
          }
          renderSuggestions(matchingBangs, '');
          return;
        }

        const queryForSuggest = activePrefix ? parts.slice(1).join(' ').trim() : val;
        if (!queryForSuggest) {
          suggestionsBox.hidden = true;
          return;
        }

        const matchedShortcuts = !activePrefix
          ? quickShortcuts
              .filter((s) => s.title.toLowerCase().startsWith(queryForSuggest.toLowerCase()))
              .slice(0, 2)
              .map((s) => ({
                type: 'shortcut',
                text: s.title,
                url: s.url,
                icon: s.icon
              }))
          : [];

        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(async () => {
          const webSuggestions = await fetchGoogleSuggestions(queryForSuggest);
          const filteredWeb = webSuggestions
            .filter((w) => !matchedShortcuts.some((m) => m.text.toLowerCase() === w.toLowerCase()))
            .slice(0, 6 - matchedShortcuts.length)
            .map((w) => ({
              type: 'web',
              text: w,
              icon: activePrefix ? engines[activePrefix].icon : 'fa-solid fa-magnifying-glass'
            }));

          if (searchInput.value.trim()) {
            renderSuggestions([...matchedShortcuts, ...filteredWeb], val);
          }
        }, 90);
      });

      searchInput.addEventListener('keydown', (e) => {
        if (suggestionsBox.hidden || !currentSuggestions.length) return;

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          selectedSuggestionIndex = (selectedSuggestionIndex + 1) % currentSuggestions.length;
          highlightSuggestion();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          selectedSuggestionIndex =
            (selectedSuggestionIndex - 1 + currentSuggestions.length) % currentSuggestions.length;
          highlightSuggestion();
        } else if (e.key === 'Tab') {
          const targetIdx = selectedSuggestionIndex >= 0 ? selectedSuggestionIndex : 0;
          const chosen = currentSuggestions[targetIdx];
          if (chosen) {
            e.preventDefault();
            if (chosen.type === 'help') {
              searchInput.value = chosen.prefix + ' ';
            } else {
              searchInput.value = activePrefix ? `${activePrefix} ${chosen.text}` : chosen.text;
            }
            searchInput.dispatchEvent(new Event('input'));
          }
        } else if (e.key === 'Escape') {
          suggestionsBox.hidden = true;
          selectedSuggestionIndex = -1;
        }
      });

      suggestionsBox.addEventListener('mousedown', (e) => {
        const li = e.target.closest('.suggestion-item');
        if (!li) return;
        const idx = Number(li.dataset.index);
        if (currentSuggestions[idx]) {
          executeSuggestion(currentSuggestions[idx]);
        }
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-wrapper')) {
          suggestionsBox.hidden = true;
        }
      });

      searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const raw = searchInput.value.trim();
        if (!raw) return;

        if (raw.toLowerCase() === '!help') {
          renderHelpMenu();
          return;
        }

        if (!suggestionsBox.hidden && selectedSuggestionIndex >= 0) {
          executeSuggestion(currentSuggestions[selectedSuggestionIndex]);
          return;
        }

        if (!calcPreview.hidden && calcPreview.dataset.result) {
          navigator.clipboard.writeText(calcPreview.dataset.result);
          calcPreview.textContent = 'Copié !';
          setTimeout(() => {
            searchInput.value = calcPreview.dataset.result;
            searchInput.dispatchEvent(new Event('input'));
          }, 500);
          return;
        }

        const parts = raw.split(' ');
        const prefix = parts[0].toLowerCase();

        if (engines[prefix]) {
          const query = parts.slice(1).join(' ');
          window.open(engines[prefix].url + encodeURIComponent(query), '_blank');
        } else {
          window.open('https://www.google.com/search?q=' + encodeURIComponent(raw), '_blank');
        }
      });

      // 7. RACCOURCIS CLAVIER (PAVÉ NUMÉRIQUE POUR THÈMES & '/' POUR RECHERCHE)
      document.addEventListener('keydown', (e) => {
        const active = document.activeElement;
        const isEditingInModal = !editModal.hidden;
        const isTodoFocused = active === document.getElementById('todo-input') || active === document.getElementById('todo-date');
        const isSearchEmpty = active === searchInput && searchInput.value.trim() === '';
        const isNotTyping = active.tagName !== 'INPUT' && active.tagName !== 'TEXTAREA';

        if (isEditingInModal) {
          if (e.key === 'Escape') closeEditModal();
          return;
        }

        const isThemeKey =
          e.code === 'Numpad1' ||
          e.code === 'Numpad2' ||
          e.code === 'Numpad3' ||
          ((isNotTyping || isSearchEmpty) && ['1', '2', '3'].includes(e.key));

        if (isThemeKey && !isTodoFocused && (isNotTyping || isSearchEmpty)) {
          const num = e.code.startsWith('Numpad') ? e.code.replace('Numpad', '') : e.key;
          if (themesConfig[num]) {
            e.preventDefault();
            applyTheme(num);
            return;
          }
        }

        if (e.key === '/' && isNotTyping) {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === 'Escape' && !isNotTyping) {
          active.blur();
        }
      });

      // 8. MINI-CALENDRIER SYNCHRONISÉ AVEC LES TÂCHES
      const calTitle = document.getElementById('cal-title');
      const calDaysContainer = document.getElementById('cal-days');
      const calPrevBtn = document.getElementById('cal-prev');
      const calNextBtn = document.getElementById('cal-next');
      const calTodayBtn = document.getElementById('cal-today');

      const todoForm = document.getElementById('todo-form');
      const todoInput = document.getElementById('todo-input');
      const todoDateInput = document.getElementById('todo-date');
      const todoListEl = document.getElementById('todo-list');
      const clearDateFilterBtn = document.getElementById('clear-date-filter');
      const filterDateLabel = document.getElementById('filter-date-label');

      let calDate = new Date();
      let selectedDateFilter = null;

      let todos = JSON.parse(localStorage.getItem('startpage_todos_v2') || '[]');

      function toISODate(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function computeDaysBadge(dateStr) {
        if (!dateStr) return null;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const [y, m, d] = dateStr.split('-').map(Number);
        const target = new Date(y, m - 1, d);
        const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));

        if (diffDays === 0) return { label: 'Auj.', cls: 'today' };
        if (diffDays > 0) return { label: `J-${diffDays}`, cls: 'upcoming' };
        return { label: `J+${Math.abs(diffDays)}`, cls: 'overdue' };
      }

      function renderCalendar() {
        const year = calDate.getFullYear();
        const month = calDate.getMonth();
        const todayStr = toISODate(new Date());

        const monthName = calDate.toLocaleDateString('fr-FR', {
          month: 'short',
          year: 'numeric'
        });
        calTitle.textContent = monthName;

        const firstDayOfMonth = new Date(year, month, 1).getDay();
        const startOffset = (firstDayOfMonth + 6) % 7;
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const taskDatesMap = {};
        todos.forEach((t) => {
          if (t.date) {
            if (!taskDatesMap[t.date]) taskDatesMap[t.date] = { pending: 0, done: 0 };
            if (t.done) taskDatesMap[t.date].done++;
            else taskDatesMap[t.date].pending++;
          }
        });

        let html = '';
        for (let i = 0; i < startOffset; i++) {
          html += `<span class="cal-day empty"></span>`;
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const isToday = iso === todayStr;
          const isSelected = iso === selectedDateFilter;
          const stats = taskDatesMap[iso];

          let classes = 'cal-day';
          if (isToday) classes += ' today';
          if (isSelected) classes += ' selected';
          if (stats) {
            classes += stats.pending > 0 ? ' has-pending' : ' has-done';
          }

          html += `
            <button type="button" class="${classes}" data-date="${iso}" title="${iso}">
              <span>${d}</span>
              ${stats ? '<i class="cal-dot"></i>' : ''}
            </button>
          `;
        }

        calDaysContainer.innerHTML = html;
      }

      function saveAndRenderTodos() {
        localStorage.setItem('startpage_todos_v2', JSON.stringify(todos));
        renderCalendar();

        if (selectedDateFilter) {
          const [y, m, d] = selectedDateFilter.split('-');
          filterDateLabel.textContent = `${d}/${m}`;
          clearDateFilterBtn.hidden = false;
        } else {
          clearDateFilterBtn.hidden = true;
        }

        const visibleTodos = todos
          .map((t, index) => ({ ...t, originalIndex: index }))
          .filter((t) => !selectedDateFilter || t.date === selectedDateFilter);

        if (visibleTodos.length === 0) {
          todoListEl.innerHTML = `<li class="todo-empty">${
            selectedDateFilter ? 'Aucune tâche à cette date.' : 'Aucune tâche en cours.'
          }</li>`;
          return;
        }

        todoListEl.innerHTML = visibleTodos
          .map((t) => {
            const badge = computeDaysBadge(t.date);
            return `
              <li class="todo-item ${t.done ? 'done' : ''}">
                <label>
                  <input type="checkbox" data-idx="${t.originalIndex}" ${t.done ? 'checked' : ''} />
                  <span class="todo-text">${t.text}</span>
                </label>
                <div class="todo-right">
                  ${badge ? `<span class="deadline-badge ${badge.cls}">${badge.label}</span>` : ''}
                  <button class="todo-del" data-del="${t.originalIndex}" title="Supprimer">&times;</button>
                </div>
              </li>
            `;
          })
          .join('');
      }

      calPrevBtn.addEventListener('click', () => {
        calDate.setMonth(calDate.getMonth() - 1);
        renderCalendar();
      });

      calNextBtn.addEventListener('click', () => {
        calDate.setMonth(calDate.getMonth() + 1);
        renderCalendar();
      });

      calTodayBtn.addEventListener('click', () => {
        calDate = new Date();
        selectedDateFilter = null;
        todoDateInput.value = '';
        saveAndRenderTodos();
      });

      calDaysContainer.addEventListener('click', (e) => {
        const dayBtn = e.target.closest('.cal-day:not(.empty)');
        if (!dayBtn) return;
        const clickedDate = dayBtn.dataset.date;

        if (selectedDateFilter === clickedDate) {
          selectedDateFilter = null;
          todoDateInput.value = '';
        } else {
          selectedDateFilter = clickedDate;
          todoDateInput.value = clickedDate;
        }
        saveAndRenderTodos();
      });

      clearDateFilterBtn.addEventListener('click', () => {
        selectedDateFilter = null;
        todoDateInput.value = '';
        saveAndRenderTodos();
      });

      todoForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = todoInput.value.trim();
        if (!text) return;

        const chosenDate = todoDateInput.value || selectedDateFilter || '';
        todos.unshift({
          text,
          date: chosenDate,
          done: false
        });

        todoInput.value = '';
        saveAndRenderTodos();
      });

      todoListEl.addEventListener('click', (e) => {
        if (e.target.matches('input[type="checkbox"]')) {
          const idx = Number(e.target.dataset.idx);
          todos[idx].done = e.target.checked;
          saveAndRenderTodos();
        } else if (e.target.matches('.todo-del')) {
          const idx = Number(e.target.dataset.del);
          todos.splice(idx, 1);
          saveAndRenderTodos();
        }
      });

      saveAndRenderTodos();

      // 9. FLUX D'ACTUALITÉS EN DIRECT
      const feedList = document.getElementById('feed-list');
      const feedTabs = document.querySelectorAll('.tab-btn');

      const rssSources = {
        f1: 'https://dwh.lequipe.fr/api/edito/rss?path=/Formule-1/',
        foot: 'https://dwh.lequipe.fr/api/edito/rss?path=/Football/'
      };

      async function fetchRssWithFallback(rssUrl) {
        try {
          const res = await fetch(
            `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`
          );
          if (res.ok) {
            const data = await res.json();
            if (data.items && data.items.length) {
              return data.items.slice(0, 5).map((i) => ({ title: i.title, link: i.link }));
            }
          }
        } catch {}

        const rawRes = await fetch(
          `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`
        );
        const xmlText = await rawRes.text();
        const xmlDoc = new DOMParser().parseFromString(xmlText, 'text/xml');
        const items = Array.from(xmlDoc.querySelectorAll('item')).slice(0, 5);
        if (!items.length) throw new Error('Empty RSS');
        return items.map((el) => ({
          title: el.querySelector('title')?.textContent || 'Actualité',
          link: el.querySelector('link')?.textContent || '#'
        }));
      }

      async function loadFeed(category) {
        feedList.innerHTML = '<li class="feed-skeleton">Récupération des dépêches...</li>';
        try {
          if (category === 'tech') {
            const res = await fetch('https://hacker-news.firebaseio.com/v0/topstories.json');
            const ids = (await res.json()).slice(0, 5);
            const items = await Promise.all(
              ids.map((id) =>
                fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then((r) => r.json())
              )
            );
            feedList.innerHTML = items
              .map(
                (item) => `
                <li>
                  <a href="${item.url || `https://news.ycombinator.com/item?id=${item.id}`}" target="_blank" rel="noopener">
                    <span class="feed-score">TECH</span>
                    <span class="feed-title">${item.title}</span>
                  </a>
                </li>`
              )
              .join('');
          } else {
            const articles = await fetchRssWithFallback(rssSources[category]);
            const tag = category === 'f1' ? 'F1' : 'FOOT';
            feedList.innerHTML = articles
              .map(
                (item) => `
                <li>
                  <a href="${item.link}" target="_blank" rel="noopener">
                    <span class="feed-score">${tag}</span>
                    <span class="feed-title">${item.title}</span>
                  </a>
                </li>`
              )
              .join('');
          }
        } catch {
          feedList.innerHTML = '<li class="feed-skeleton">Flux temporairement indisponible.</li>';
        }
      }

      feedTabs.forEach((btn) => {
        btn.addEventListener('click', () => {
          feedTabs.forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          loadFeed(btn.dataset.feed);
        });
      });
      loadFeed('f1');
    </script>
  </body>
</html>
